{{ define "main" }}

<article class="post">
  <header class="post-header">
    <a href="/"><h1>{{ .Title }}</h1></a>
    {{ if not .Date.IsZero}}
    <time>{{ .Date.Format "2006-01-02 Mon" }}</time>
    {{ end }}
  </header>
  <article class="post-content">
    {{ .Content }}
  </article>
</article>

{{ end }}
