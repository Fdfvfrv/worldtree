{{ define "main" }}

<article>
  <header class="post-header">
    <a href="/"><h1>{{ .Title }}</h1></a>
    {{ if not .Date.IsZero}}
    <create-time>{{ .Date.Format "2006-01-02 Mon" }}</create-time>
    {{ end }}
  </header>
  <article class="post-content">
    {{ .Content }}
    {{ if not .Date.IsZero}}
    <lamod-time>
      <a href="/">> </a>{{ .Lastmod.Format "最后更新于2006年01月02日" }}
    </lamod-time>
    {{ end }}
  </article>
</article>

{{ end }}
