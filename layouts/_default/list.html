{{ define "main" }}

<div class="post-list">

  {{ range where .Site.RegularPages "Section" "posts" }}
  <article class="post-card">
    <h2>
      <a href="{{ .Permalink }}">{{ .Title }}</a>
    </h2>
    {{ if .Summary }}
      <summary>{{ .Summary }}</summary>
    {{ end }}
    {{ if .Params.excerpt }}
      <summary>{{ .Params.excerpt }}</summary>
    {{ end }}
  </article>
  {{ end }}

</div>

{{ end }}
