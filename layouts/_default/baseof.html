<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>
    {{ if .IsHome }}
      {{ .Site.Title }}
    {{ else }}
      {{ .Title }}
    {{ end }}
  </title>
  <link rel="stylesheet" href="/css/page.css">
  <link rel="stylesheet" href="/css/partials.css">
</head>
<body>

  {{ if .IsHome }}
  <header class="site-header">
    <a class="site-title" href="/">{{ .Site.Title }}</a>
    <nav>
      <a href="/links/">果壳铃</a>
      <a href="/fun/">根系</a>
      <a href="/about/">树</a>
    </nav>
  </header>

  {{ end }}

  <main class="site-main">
    {{ block "main" . }}{{ end }}
  </main>

  <footer>
    <p>© {{ now.Year }} Here is 37 </p>
    <p>内容采用
    <a rel="license" href="{{ .Site.Params.licenseURL }}" target="_blank">{{ .Site.Params.license }}</a>
    许可</p>
  </footer>

</body>
</html>
